name: Django CI and k0s deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [k8s/kustomization.yaml]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment:
    permissions:
      contents: write
    uses: chnm/.github/.github/workflows/django--k0s.yml@33481c3e14d9ca408396865acec1ca1b3664110d
    with:
      image: rrchnm/winterthur-django
      ref: main
    secrets:
      ZOT_TOKEN: ${{ secrets.ZOT_TOKEN }}
      PIN_APP_PRIVATE_KEY: ${{ secrets.PIN_APP_PRIVATE_KEY }}
