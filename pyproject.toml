[tool.poetry]
name = "winterthur-app"
version = "0.1.0"
description = "Web application for the Denig Manuscript project"
authors = ["Jason Heppler <jason.heppler@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "winterthur_app"}]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2.7"
django-tailwind = "^4.3.1"
django-htmx = "^1.26.0"
django-extensions = "^4.1"
django-environ = "^0.12.0"
humanfriendly = "^10.0"
django-taggit = "^5.0.1"
taggit-selectize = "^2.11.0"
django-multiselectfield = "^1.0.1"
pillow = "^10.4.0"
django-admin-interface = "^0.30.1"
python-dotenv = "^1.2.1"
django-import-export = "^4.3.13"
django-allauth = "^65.13.0"
daphne = "^4.2.1"
django-dbml = "^0.10.1"
django-prose = "^2.1.0"
psycopg2 = "^2.9.11"
wagtail = "^7.1.2"
django-modelcluster = "^6.4"
pandas = "^2.3.3"
numpy = "^2.3.4"
django-imagekit = "^6.0.0"
boto3 = "^1.40.64"
django-storages = "^1.14.6"
django-cleanup = "^9.0.0"
whitenoise = "^6.11.0"


[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
djhtml = "^3.0.10"
pre-commit = "^4.3.0"
django-debug-toolbar = "^6.1.0"
pytest-django = "^4.11.1"
django-extensions = "^4.1"
django-coverage-plugin = "^3.2.0"
pylint-django = "^2.6.1"
pytest-sugar = "^1.1.1"


[tool.poetry.group.base.dependencies]
python-slugify = "^8.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.djlint]
profile="django"